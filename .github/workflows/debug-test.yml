name: 🔍 Debug Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.9'

jobs:
  debug-basic:
    name: 🔍 Debug Basic Functionality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 🔍 Debug Environment
      run: |
        echo "🔍 Environment Debug Info:"
        echo "Python version: $(python --version)"
        echo "Working directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        echo "Requirements file:"
        cat requirements.txt
    
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Dependencies installed"
        pip list | grep -E "(pydantic|flask|openai)"
    
    - name: 🧪 Test Basic Imports (Step by Step)
      run: |
        echo "Testing imports one by one..."
        
        echo "1. Testing Flask import..."
        python -c "import flask; print('✅ Flask imported')"
        
        echo "2. Testing Pydantic import..."
        python -c "import pydantic; print('✅ Pydantic imported')"
        
        echo "3. Testing Pydantic AI import..."
        python -c "import pydantic_ai; print('✅ Pydantic AI imported')" || echo "❌ Pydantic AI import failed"
        
        echo "4. Testing dotenv import..."
        python -c "from dotenv import load_dotenv; print('✅ Dotenv imported')" || echo "❌ Dotenv import failed"
        
        echo "5. Testing parser module..."
        python -c "import parser; print('✅ Parser module imported')" || echo "❌ Parser import failed"
    
    - name: 🔍 Test Parser Module Specifically
      run: |
        echo "Testing parser functionality..."
        python -c "
        try:
            from parser import get_endpoints
            print('✅ get_endpoints function imported')
        except ImportError as e:
            print(f'❌ Import error: {e}')
        except Exception as e:
            print(f'❌ Other error: {e}')
        "
    
    - name: 🔍 Test Generate Docs Module
      run: |
        echo "Testing generate_docs_pydantic_ai module..."
        
        # Create dummy .env file
        echo "OPENAI_API_KEY=dummy_key_for_testing" > .env
        
        python -c "
        try:
            import generate_docs_pydantic_ai
            print('✅ generate_docs_pydantic_ai module imported')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            import traceback
            traceback.print_exc()
        except Exception as e:
            print(f'❌ Other error: {e}')
            import traceback
            traceback.print_exc()
        "
    
    - name: 🔍 Test Server Module
      run: |
        echo "Testing serve_swagger_ui module..."
        python -c "
        try:
            import serve_swagger_ui
            print('✅ serve_swagger_ui module imported')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            import traceback
            traceback.print_exc()
        except Exception as e:
            print(f'❌ Other error: {e}')
            import traceback
            traceback.print_exc()
        "

  debug-code-quality:
    name: 🔍 Debug Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📦 Install Code Quality Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: 🔍 Test Flake8
      run: |
        echo "Testing flake8..."
        echo "Current directory:"
        pwd
        echo "Python files found:"
        find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" -not -path "./pratham-test/*"
        
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,pratham-test,.git || echo "flake8 failed"
    
    - name: 🔍 Test Black
      run: |
        echo "Testing black..."
        black --check --diff . --exclude="(.venv|__pycache__|pratham-test|.git)" || echo "black check failed"
    
    - name: 🔍 Test isort
      run: |
        echo "Testing isort..."
        isort --check-only --diff . --skip=.venv --skip=__pycache__ --skip=pratham-test --skip=.git || echo "isort check failed"
