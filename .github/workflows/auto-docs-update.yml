name: 🤖 Auto-Update API Documentation

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'           # Any Python file changes
      - 'app.py'          # Main Flask app
      - 'parser.py'       # Parser changes
      - 'examples/**'     # Example app changes
      - 'generate_docs_pydantic_ai.py'  # Generator updates
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
  workflow_dispatch:      # Allow manual trigger

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  detect-api-changes:
    name: 🔍 Detect API Changes
    runs-on: ubuntu-latest
    outputs:
      docs-needed: ${{ steps.check-changes.outputs.docs-needed }}
      changed-files: ${{ steps.check-changes.outputs.changed-files }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Need previous commit for comparison
    
    - name: 🔍 Check for API Changes
      id: check-changes
      run: |
        # Check if Python files or API-related files changed
        CHANGED_FILES=$(git diff --name-only HEAD^ HEAD | grep -E '\.(py)$|^app\.py$|^parser\.py$|^examples/' || true)
        
        if [ -n "$CHANGED_FILES" ]; then
          echo "docs-needed=true" >> $GITHUB_OUTPUT
          echo "changed-files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "🔄 API changes detected in:"
          echo "$CHANGED_FILES"
        else
          echo "docs-needed=false" >> $GITHUB_OUTPUT
          echo "✅ No API changes detected"
        fi

  generate-documentation:
    name: 📚 Generate API Documentation
    runs-on: ubuntu-latest
    needs: detect-api-changes
    if: needs.detect-api-changes.outputs.docs-needed == 'true'
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🔐 Configure OpenAI API Key
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        
    - name: 🤖 Generate Documentation with Pydantic AI
      id: generate-docs
      run: |
        echo "🚀 Starting documentation generation..."
        
        # Run the documentation generator
        python generate_docs_pydantic_ai.py
        
        # Check if documentation was generated
        if [ -f "docs/openapi_pydantic_ai.json" ]; then
          echo "✅ Documentation generated successfully"
          echo "doc-generated=true" >> $GITHUB_OUTPUT
          
          # Get stats about generated docs
          ENDPOINTS_COUNT=$(jq '.paths | length' docs/openapi_pydantic_ai.json)
          echo "endpoints-count=$ENDPOINTS_COUNT" >> $GITHUB_OUTPUT
          echo "📊 Generated documentation for $ENDPOINTS_COUNT endpoints"
        else
          echo "❌ Documentation generation failed"
          echo "doc-generated=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: 📊 Documentation Statistics
      if: steps.generate-docs.outputs.doc-generated == 'true'
      run: |
        echo "📈 Documentation Statistics:"
        echo "----------------------------------------"
        echo "📋 Total Endpoints: $(jq '.paths | length' docs/openapi_pydantic_ai.json)"
        echo "🎯 OpenAPI Version: $(jq -r '.openapi' docs/openapi_pydantic_ai.json)"
        echo "📄 API Title: $(jq -r '.info.title' docs/openapi_pydantic_ai.json)"
        echo "🔖 API Version: $(jq -r '.info.version' docs/openapi_pydantic_ai.json)"
        echo "📏 File Size: $(du -h docs/openapi_pydantic_ai.json | cut -f1)"
        echo "----------------------------------------"
    
    - name: 🎨 Generate Enhanced Swagger UI
      if: steps.generate-docs.outputs.doc-generated == 'true'
      run: |
        echo "🎨 Generating enhanced Swagger UI..."
        
        # Create enhanced index.html with timestamp
        cat > docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Auto-DocGen API Documentation</title>
            <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
            <style>
                .swagger-ui .topbar { background-color: #1976d2; }
                .auto-generated-badge {
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white; padding: 10px 20px; text-align: center; font-size: 14px;
                }
            </style>
        </head>
        <body>
            <div class="auto-generated-badge">
                🤖 Auto-Generated Documentation | Last Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC") | Powered by Pydantic AI
            </div>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
            <script>
                SwaggerUIBundle({
                    url: './openapi_pydantic_ai.json',
                    dom_id: '#swagger-ui',
                    presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.presets.standalone],
                    layout: "StandaloneLayout"
                });
            </script>
        </body>
        </html>
        EOF
        
        echo "✅ Enhanced Swagger UI generated"
    
    - name: 📤 Commit Updated Documentation
      if: steps.generate-docs.outputs.doc-generated == 'true'
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "Auto-DocGen Bot"
        
        # Add generated files
        git add docs/openapi_pydantic_ai.json docs/index.html
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "📄 No documentation changes to commit"
        else
          # Create commit with detailed message
          COMMIT_MSG="🤖 Auto-update API documentation

          📊 Generated for ${{ steps.generate-docs.outputs.endpoints-count }} endpoints
          🔄 Triggered by: ${{ github.event_name }}
          📝 Changed files: ${{ needs.detect-api-changes.outputs.changed-files }}
          🕐 Generated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          Auto-generated by GitHub Actions using Pydantic AI"
          
          git commit -m "$COMMIT_MSG"
          echo "✅ Documentation committed successfully"
        fi
    
    - name: 🚀 Push Documentation Updates
      if: steps.generate-docs.outputs.doc-generated == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

  deploy-to-pages:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [detect-api-changes, generate-documentation]
    if: needs.detect-api-changes.outputs.docs-needed == 'true' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}  # Get the latest commit with updated docs
    
    - name: 🔄 Pull Latest Changes
      run: git pull origin ${{ github.ref_name }}
    
    - name: 📋 Setup Pages
      uses: actions/configure-pages@v3
    
    - name: 📁 Prepare Pages Content
      run: |
        # Create a dedicated pages directory
        mkdir -p _site
        
        # Copy documentation files
        cp docs/index.html _site/
        cp docs/openapi_pydantic_ai.json _site/
        
        # Create a nice landing page
        cat > _site/README.md << 'EOF'
        # 🤖 Auto-DocGen API Documentation
        
        This documentation is automatically generated and updated using Pydantic AI agents.
        
        ## 📚 Available Documentation
        
        - **[Interactive API Documentation](./index.html)** - Swagger UI interface
        - **[OpenAPI Specification](./openapi_pydantic_ai.json)** - Raw JSON specification
        
        ## 🔄 Auto-Update Process
        
        This documentation is automatically regenerated whenever:
        - Python files are modified
        - API endpoints are added, modified, or removed
        - The main application structure changes
        
        **Last Updated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Generated by:** Auto-DocGen with Pydantic AI + GPT-3.5-turbo
        EOF
    
    - name: 📤 Upload Pages Artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: '_site'
    
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2

  notify-completion:
    name: 📢 Notify Completion
    runs-on: ubuntu-latest
    needs: [detect-api-changes, generate-documentation, deploy-to-pages]
    if: always()
    
    steps:
    - name: 📊 Summary Report
      run: |
        echo "🤖 Auto-DocGen CI/CD Pipeline Completed"
        echo "========================================"
        echo "🔍 API Changes Detected: ${{ needs.detect-api-changes.outputs.docs-needed }}"
        echo "📚 Documentation Generated: ${{ needs.generate-documentation.result }}"
        echo "🌐 Pages Deployed: ${{ needs.deploy-to-pages.result }}"
        echo "🕐 Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        
        if [ "${{ needs.generate-documentation.result }}" == "success" ]; then
          echo "✅ Documentation successfully updated and deployed!"
          echo "🔗 View at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        elif [ "${{ needs.detect-api-changes.outputs.docs-needed }}" == "false" ]; then
          echo "ℹ️ No API changes detected - documentation update skipped"
        else
          echo "❌ Documentation update failed - check logs above"
        fi
